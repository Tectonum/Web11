<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Tasks</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
    <h1>My tasks</h1>
    <p>Planning my day!</p>
    <div class="form-row">
        <input id="taskInput" type="text" placeholder="New task...">
        <button id="addButton" type="button">Add</button>
    </div>

    <p>Total tasks: <strong id="taskCounter">0</strong></p>
    <ul id="taskList"></ul>

</main>

<script src="script.js" defer></script>
</body>
</html>
